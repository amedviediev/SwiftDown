name: SwiftDown
options:
  bundleIdPrefix: com.swiftdown
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    branch: main
  Nimble:
    url: https://github.com/Quick/Nimble.git
    from: "9.0.0"

targets:
  SwiftDown:
    type: framework
    platform: macOS
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
    sources:
      - path: Sources/SwiftDown
        excludes:
          - "Resources/**"
      - path: Sources/SwiftDown/Resources/Themes
        buildPhase: resources
        type: folder
    dependencies:
      - package: swift-markdown
        product: Markdown

  SwiftDownDemo:
    type: application
    platform: macOS
    sources:
      - path: SwiftDownDemo/Shared
      - path: SwiftDownDemo/macOS
        excludes:
          - "*.entitlements"
    dependencies:
      - target: SwiftDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftdown.demo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.9"

  SwiftDownTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SwiftDownTests
    dependencies:
      - target: SwiftDown
      - package: Nimble
    settings:
      base:
        SWIFT_VERSION: "5.9"
